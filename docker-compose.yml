# BIND controls which host interface the app ports are published on. It defaults
# to 0.0.0.0 so local dev reaches them as usual; set BIND=127.0.0.1 in a root
# .env on a deployed host so only Caddy is exposed to the internet.
services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: assignment_hub
    ports:
      - "${BIND:-0.0.0.0}:3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql  # without this, all data lives in the container
                                # layer and every `docker compose down` wipes it

  backend:
    build: ./backend
    ports:
      - "${BIND:-0.0.0.0}:3000:3000"
    depends_on:
      - db
    env_file:
      - .env.local              # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / SESSION_SECRET (git-ignored)
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: assignment_hub
      # PUBLIC_URL is the origin the browser actually uses. Defaults to the local
      # dev setup; on a deployed host set it in a root .env (see .env.example).
      OAUTH_REDIRECT_URL: ${PUBLIC_URL:-http://localhost:5173}/api/auth/google/callback
      MS_OAUTH_REDIRECT_URL: ${PUBLIC_URL:-http://localhost:5173}/api/auth/microsoft/callback
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:5173}
    volumes:
      - ./backend:/app          # mount source for hot reload
      - /app/node_modules       # keep container's installed modules

  frontend:
    build: ./frontend
    ports:
      - "${BIND:-0.0.0.0}:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    environment:
      # Behind a TLS proxy the HMR websocket must dial the public port (443),
      # not Vite's own 5173 — otherwise the browser console fills with failed
      # wss:// attempts. Empty in local dev, where the default is correct.
      VITE_HMR_CLIENT_PORT: ${HMR_CLIENT_PORT:-}
    volumes:
      - ./frontend:/app         # mount source for hot reload
      - /app/node_modules       # keep container's installed modules

  # HTTPS entry point. Opt-in: `docker compose --profile tls up -d`.
  # Left out of the default set so local dev doesn't try to issue a certificate.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"           # HTTP/3
    environment:
      # Compose interpolates this even when the profile is off, so it needs a
      # default rather than a required marker. Keep it in step with
      # `allowedHosts` in frontend/vite.config.js.
      SITE_HOST: ${SITE_HOST:-assignment-hubb.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data        # issued certificates — must persist, or every
                                # recreate re-requests one and hits Let's
                                # Encrypt's rate limit (5 per domain per week)
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  db_data:
  caddy_data:
  caddy_config:
