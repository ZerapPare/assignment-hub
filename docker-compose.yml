# BIND controls which host interface the app ports are published on. It defaults
# to 0.0.0.0 so local dev reaches them as usual; set BIND=127.0.0.1 in a root
# .env on a deployed host so only Caddy is exposed to the internet.
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: assignment_hub
      TZ: ${APP_TZ:-Asia/Bangkok}
    ports:
      - "${BIND:-0.0.0.0}:3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_data:/var/lib/mysql  # without this, all data lives in the container
                                # layer and every `docker compose down` wipes it

  backend:
    build: ./backend
    restart: unless-stopped     # a crash or VM reboot brings it back without anyone logging in
    ports:
      - "${BIND:-0.0.0.0}:3000:3000"
    depends_on:
      - db
    env_file:
      - .env.local              # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / SESSION_SECRET (git-ignored)
    environment:
      NODE_ENV: development
      TZ: ${APP_TZ:-Asia/Bangkok}   # must match the db service — see the note there
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: assignment_hub
      # PUBLIC_URL is the origin the browser actually uses. Defaults to the local
      # dev setup; on a deployed host set it in a root .env (see .env.example).
      OAUTH_REDIRECT_URL: ${PUBLIC_URL:-http://localhost:4173}/api/auth/google/callback
      MS_OAUTH_REDIRECT_URL: ${PUBLIC_URL:-http://localhost:4173}/api/auth/microsoft/callback
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:4173}
    volumes:
      - ./backend:/app          # mount source for hot reload
      - /app/node_modules       # keep container's installed modules

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${BIND:-0.0.0.0}:${FRONTEND_PORT:-4173}:4173"
    depends_on:
      - backend
    environment:
      # Behind a TLS proxy the HMR websocket must dial the public port (443),
      # not Vite's own 4173 — otherwise the browser console fills with failed
      # wss:// attempts. Empty in local dev, where the default is correct.
      VITE_HMR_CLIENT_PORT: ${HMR_CLIENT_PORT:-}
    volumes:
      - ./frontend:/app         # mount source for hot reload
      - /app/node_modules       # keep container's installed modules

  # Entry point on the deployed host. Opt-in: `docker compose --profile tls up -d`.
  # Plain http only — Cloudflare in front holds the certificate; see Caddyfile.
  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    ports:
      # The init.d gateway forwards the domain to this VM's port 4173 and that
      # target is not ours to change, so Caddy takes 4173. The frontend's own
      # host port must then move out of the way: set FRONTEND_PORT=4174 in .env
      # on the deployed host, or `up` fails with "port is already allocated".
      - "${PROXY_PORT:-4173}:80"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

volumes:
  db_data:
  caddy_data:
  caddy_config:
