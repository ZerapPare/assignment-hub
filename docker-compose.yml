services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: assignment_hub
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    depends_on:
      - db
    env_file:
      - .env.local              # GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / SESSION_SECRET (git-ignored)
    environment:
      NODE_ENV: development
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: root123
      DB_NAME: assignment_hub
      OAUTH_REDIRECT_URL: http://localhost:5173/api/auth/google/callback
      MS_OAUTH_REDIRECT_URL: http://localhost:5173/api/auth/microsoft/callback
      FRONTEND_URL: http://localhost:5173
    volumes:
      - ./backend:/app          # mount source for hot reload
      - /app/node_modules       # keep container's installed modules

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app         # mount source for hot reload
      - /app/node_modules       # keep container's installed modules
